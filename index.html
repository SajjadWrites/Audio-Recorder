<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Log Cataloger</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #2ec4b6;
            --danger: #e71d36;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        h1 { margin-top: 0; font-size: 22px; }
        
        .timer {
            font-size: 42px;
            font-family: monospace;
            font-weight: bold;
            margin: 10px 0;
            color: var(--primary);
        }

        canvas {
            width: 100%;
            height: 50px;
            background: #020617;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            font-size: 14px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        #startBtn { background-color: var(--primary); color: #0f172a; }
        #pauseBtn { background-color: #eab308; color: #0f172a; }
        #stopBtn { background-color: var(--danger); color: white; }
        button:disabled { background-color: #475569 !important; color: var(--text-muted) !important; opacity: 0.5; cursor: not-allowed; }

        .section-title {
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin: 20px 0 10px 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .meta-input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: left;
            font-size: 13px;
            margin-bottom: 10px;
        }

        label { display: block; margin-bottom: 4px; color: var(--text-muted); }
        select, input, textarea {
            background: #0f172a;
            color: white;
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea { resize: vertical; height: 60px; }

        .catalog-container {
            width: 100%;
            max-width: 500px;
        }

        .search-box {
            margin-bottom: 15px;
        }

        .log-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .log-title { font-weight: bold; font-size: 16px; color: var(--text-color); }
        .log-date { font-size: 12px; color: var(--text-muted); }
        
        .tag-badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 4px;
            text-transform: uppercase;
        }
        .tag-work { background: #3b82f6; color: white; }
        .tag-personal { background: #ec4899; color: white; }
        .tag-idea { background: #eab308; color: #0f172a; }
        .tag-journal { background: #8b5cf6; color: white; }
        .tag-custom { background: #64748b; color: white; }

        .log-notes {
            font-size: 13px;
            color: var(--text-muted);
            margin: 8px 0;
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid var(--primary);
            white-space: pre-wrap;
        }

        audio { width: 100%; margin-top: 5px; }
        
        .card-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
        }
        .action-btn {
            background: transparent;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
        }
        .action-btn.download { border-color: var(--primary); color: var(--primary); }
        .action-btn.edit { border-color: #eab308; color: #eab308; }
        .action-btn.delete { border-color: var(--danger); color: var(--danger); }
        .action-btn.save { border-color: var(--primary); color: var(--primary); font-weight: bold; }
        .action-btn.cancel { border-color: var(--text-muted); color: var(--text-muted); }

        .edit-input, .edit-textarea, .edit-select {
            margin-bottom: 8px;
            background: #0f172a;
            border: 1px solid var(--primary);
        }
        .edit-textarea { height: 80px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Voice Log Controller</h1>
    
    <div class="timer" id="timerDisplay">00:00</div>
    <canvas id="visualizer"></canvas>

    <div class="controls">
        <button id="startBtn">🔴 Record</button>
        <button id="pauseBtn" disabled>⏸️ Pause</button>
        <button id="stopBtn" disabled>⏹️ Save Log</button>
    </div>

    <div class="section-title">Log Metadata</div>
    <div class="meta-input-group">
        <div>
            <label for="logTitle">Log Title</label>
            <input type="text" id="logTitle" value="Voice Entry">
        </div>
        <div>
            <label for="logTag">Category Tag</label>
            <div style="display: flex; gap: 5px;">
                <select id="logTag">
                    <option value="personal">🌸 Personal</option>
                    <option value="work">💼 Work</option>
                    <option value="idea">💡 Idea</option>
                    <option value="journal">📖 Journal</option>
                </select>
                <button id="addTagBtn" style="padding: 8px 12px; background: #475569; color: white; margin: 0; border-radius: 6px;">+</button>
            </div>
        </div>
    </div>
    <div style="text-align: left; font-size: 13px;">
        <label for="logNotes">Summary / Log Notes</label>
        <textarea id="logNotes" placeholder="Add keywords, thoughts, or bullet points here..."></textarea>
    </div>
</div>

<div class="catalog-container">
    <div class="section-title">🗂️ Permanent Voice Catalogue</div>
    <input type="text" id="searchBar" class="search-box" placeholder="🔍 Search notes, titles, or tags...">
    
    <div id="catalogList"></div>
</div>

<script>
    let mediaRecorder, audioChunks = [], startTime, timerInterval, elapsedTime = 0;
    let audioContext, analyser, dataArray, canvasContext, source, animationFrameId;
    let db = null;

    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const timerDisplay = document.getElementById('timerDisplay');
    const canvas = document.getElementById('visualizer');
    const catalogList = document.getElementById('catalogList');
    const searchBar = document.getElementById('searchBar');
    const addTagBtn = document.getElementById('addTagBtn');
    const logTagSelect = document.getElementById('logTag');
    
    if (canvas) canvasContext = canvas.getContext('2d');

    // --- IndexedDB Configuration Engine (Unlimited Storage Setup) ---
    const dbRequest = indexedDB.open("VoiceLogDatabase", 1);
    
    dbRequest.onupgradeneeded = (e) => {
        let database = e.target.result;
        if (!database.objectStoreNames.contains("logs")) {
            database.createObjectStore("logs", { keyPath: "id" });
        }
    };

    dbRequest.onsuccess = (e) => {
        db = e.target.result;
        loadCatalog();
        loadCustomTags();
    };

    dbRequest.onerror = () => alert("Database initialization failed.");

    if (searchBar) searchBar.addEventListener('input', filterCatalog);

    if (addTagBtn) {
        addTagBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const newTag = prompt("Enter custom tag name:");
            if (newTag) {
                const sanitizedTag = newTag.trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
                if (!sanitizedTag) return alert("Invalid tag name.");
                
                let customTags = JSON.parse(localStorage.getItem('customVoiceTags')) || [];
                if (!customTags.includes(sanitizedTag)) {
                    customTags.push(sanitizedTag);
                    localStorage.setItem('customVoiceTags', JSON.stringify(customTags));
                    addTagToDropdown(sanitizedTag);
                    logTagSelect.value = sanitizedTag;
                } else {
                    alert("This tag already exists!");
                }
            }
        });
    }

    if (startBtn) {
        startBtn.addEventListener('click', async () => {
            audioChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                let selectedMime = 'audio/webm';
                if (!MediaRecorder.isTypeSupported(selectedMime)) {
                    selectedMime = 'audio/mp4'; 
                    if (!MediaRecorder.isTypeSupported(selectedMime)) selectedMime = ''; 
                }

                mediaRecorder = selectedMime ? new MediaRecorder(stream, { mimeType: selectedMime }) : new MediaRecorder(stream);
                setupVisualizer(stream);

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/wav' });
                    saveLogToIndexedDB(blob);
                    resetUI();
                };

                mediaRecorder.start(250);
                startTime = Date.now() - elapsedTime;
                startTimer();
                toggleButtons(true);
            } catch (err) { alert("Microphone access blocked or format error: " + err.message); }
        });
    }

    if (pauseBtn) {
        pauseBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.pause(); clearInterval(timerInterval); elapsedTime = Date.now() - startTime; pauseBtn.innerText = "▶️ Resume";
            } else if (mediaRecorder && mediaRecorder.state === "paused") {
                mediaRecorder.resume(); startTime = Date.now() - elapsedTime; startTimer(); pauseBtn.innerText = "⏸️ Pause";
            }
        });
    }

    if (stopBtn) {
        stopBtn.addEventListener('click', () => {
            if (mediaRecorder) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                cancelAnimationFrame(animationFrameId);
            }
        });
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            const totalSeconds = Math.floor((Date.now() - startTime) / 1000);
            timerDisplay.innerText = `${String(Math.floor(totalSeconds / 60)).padStart(2, '0')}:${String(totalSeconds % 60).padStart(2, '0')}`;
        }, 1000);
    }

    function resetUI() {
        clearInterval(timerInterval); elapsedTime = 0; timerDisplay.innerText = "00:00";
        toggleButtons(false); if(pauseBtn) pauseBtn.innerText = "⏸️ Pause";
        if (canvasContext && canvas) canvasContext.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById('logNotes').value = '';
    }

    function toggleButtons(isRecording) {
        if(startBtn) startBtn.disabled = isRecording; 
        if(pauseBtn) pauseBtn.disabled = !isRecording; 
        if(stopBtn) stopBtn.disabled = !isRecording;
    }

    // --- Write Object To IndexedDB Store ---
    function saveLogToIndexedDB(blob) {
        if (!db) return;
        const currentTag = document.getElementById('logTag').value;
        
        const logEntry = {
            id: Date.now(),
            title: document.getElementById('logTitle').value || 'Untitled Entry',
            tag: currentTag,
            notes: document.getElementById('logNotes').value || 'No descriptions added.',
            date: new Date().toLocaleDateString(),
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            audioBlob: blob // Stored safely as raw binary data
        };

        const transaction = db.transaction(["logs"], "readwrite");
        const store = transaction.objectStore("logs");
        const request = store.add(logEntry);

        request.onsuccess = () => loadCatalog();
        request.onerror = (e) => alert("Failed to write data locally: " + e.target.error);
    }

    function loadCustomTags() {
        if (!logTagSelect) return;
        let customTags = JSON.parse(localStorage.getItem('customVoiceTags')) || [];
        customTags.forEach(tag => {
            if (![...logTagSelect.options].some(option => option.value === tag)) {
                addTagToDropdown(tag);
            }
        });
    }

    function addTagToDropdown(tag) {
        if (!logTagSelect) return;
        const option = document.createElement('option');
        option.value = tag;
        option.innerText = `🏷️ ${tag.charAt(0).toUpperCase() + tag.slice(1)}`;
        logTagSelect.appendChild(option);
    }

    // --- Read and Render Objects From IndexedDB ---
    function loadCatalog() {
        if (!db || !catalogList) return;
        catalogList.innerHTML = '';
        
        const transaction = db.transaction(["logs"], "readonly");
        const store = transaction.objectStore("logs");
        const request = store.getAll();

        request.onsuccess = (e) => {
            const logs = e.target.result;
            // Sort to keep newest entries on top
            logs.sort((a, b) => b.id - a.id);

            if(logs.length === 0) {
                catalogList.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:20px;">No logs saved yet.</div>`;
                return;
            }

            const builtInTags = ['personal', 'work', 'idea', 'journal'];

            logs.forEach(log => {
                const badgeClass = builtInTags.includes(log.tag) ? `tag-${log.tag}` : 'tag-custom';
                const card = document.createElement('div');
                card.className = 'log-card';
                card.id = `log-${log.id}`;
                card.setAttribute('data-search', `${log.title} ${log.tag} ${log.notes}`.toLowerCase());
                
                // Create object URL out of raw audio Blob safely
                const audioURL = URL.createObjectURL(log.audioBlob);
                
                card.innerHTML = `
                    <div class="log-view-mode">
                        <div class="log-header">
                            <div>
                                <div class="log-title">${log.title}</div>
                                <span class="tag-badge ${badgeClass}">${log.tag}</span>
                            </div>
                            <div class="log-date">${log.date} @ ${log.time}</div>
                        </div>
                        <div class="log-notes">${log.notes}</div>
                        <audio controls src="${audioURL}"></audio>
                        <div class="card-actions">
                            <button class="action-btn download" onclick="downloadItem(${log.id})">💾 Export</button>
                            <button class="action-btn edit" onclick="enterEditMode(${log.id})">✏️ Edit</button>
                            <button class="action-btn delete" onclick="deleteItem(${log.id})">🗑️ Delete</button>
                        </div>
                    </div>
                `;
                catalogList.appendChild(card);
            });
        };
    }

    window.enterEditMode = function(id) {
        if (!db) return;
        const transaction = db.transaction(["logs"], "readonly");
        const store = transaction.objectStore("logs");
        const request = store.get(id);

        request.onsuccess = (e) => {
            const log = e.target.result;
            if (!log) return;

            const card = document.getElementById(`log-${id}`);
            const tagSelect = document.getElementById('logTag');
            const tagOptions = [...tagSelect.options].map(opt => 
                `<option value="${opt.value}" ${opt.value === log.tag ? 'selected' : ''}>${opt.innerText}</option>`
            ).join('');

            card.innerHTML = `
                <div class="log-edit-mode" style="display: flex; flex-direction: column; gap: 6px;">
                    <div style="font-size: 11px; color: var(--primary); font-weight: bold; text-transform: uppercase;">Editing Log Metadata</div>
                    <label style="font-size: 11px; margin: 0;">Log Title</label>
                    <input type="text" id="editTitle-${id}" class="edit-input" value="${log.title}">
                    <label style="font-size: 11px; margin: 0;">Category Tag</label>
                    <select id="editTag-${id}" class="edit-select">${tagOptions}</select>
                    <label style="font-size: 11px; margin: 0;">Summary / Log Notes</label>
                    <textarea id="editNotes-${id}" class="edit-textarea">${log.notes}</textarea>
                    <div class="card-actions" style="margin-top: 5px;">
                        <button class="action-btn save" onclick="saveEdit(${id})">✅ Save Changes</button>
                        <button class="action-btn cancel" onclick="loadCatalog()">❌ Cancel</button>
                    </div>
                </div>
            `;
        };
    };

    window.saveEdit = function(id) {
        if (!db) return;
        const transaction = db.transaction(["logs"], "readwrite");
        const store = transaction.objectStore("logs");
        
        store.get(id).onsuccess = (e) => {
            const log = e.target.result;
            if(log) {
                log.title = document.getElementById(`editTitle-${id}`).value || 'Untitled Entry';
                log.tag = document.getElementById(`editTag-${id}`).value;
                log.notes = document.getElementById(`editNotes-${id}`).value || 'No descriptions added.';
                
                const updateRequest = store.put(log);
                updateRequest.onsuccess = () => loadCatalog();
            }
        };
    };

    function filterCatalog(e) {
        const query = e.target.value.toLowerCase();
        const cards = document.querySelectorAll('.log-card');
        cards.forEach(card => {
            const content = card.getAttribute('data-search');
            card.style.display = content.includes(query) ? 'block' : 'none';
        });
    }

    window.downloadItem = function(id) {
        if (!db) return;
        const transaction = db.transaction(["logs"], "readonly");
        const store = transaction.objectStore("logs");
        store.get(id).onsuccess = (e) => {
            const log = e.target.result;
            if(log) {
                const url = URL.createObjectURL(log.audioBlob);
                const a = document.createElement('a'); 
                a.href = url; 
                a.download = `${log.title}.webm`; 
                a.click();
            }
        };
    };

    window.deleteItem = function(id) {
        if(!db) return;
        if(confirm("Are you sure you want to delete this log permanently?")) {
            const transaction = db.transaction(["logs"], "readwrite");
            const store = transaction.objectStore("logs");
            const request = store.delete(id);
            request.onsuccess = () => loadCatalog();
        }
    };

    function setupVisualizer(stream) {
        if (!canvasContext || !canvas) return;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 128;
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        
        function draw() {
            animationFrameId = requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);
            canvasContext.fillStyle = '#020617';
            canvasContext.fillRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / bufferLength) * 2;
            let x = 0;
            for (let i = 0; i < bufferLength; i++) {
                let barHeight = dataArray[i] / 3;
                canvasContext.fillStyle = `rgb(46, 196, 182)`;
                canvasContext.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
                x += barWidth;
            }
        }
        draw();
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('PWA Active'))
                .catch(err => console.log('SW Error'));
        });
    }
</script>
</body>
</html>
