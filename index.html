<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Log Cataloger</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #2ec4b6;
            --danger: #e71d36;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        h1 { margin-top: 0; font-size: 22px; }
        
        .timer {
            font-size: 42px;
            font-family: monospace;
            font-weight: bold;
            margin: 10px 0;
            color: var(--primary);
        }

        canvas {
            width: 100%;
            height: 50px;
            background: #020617;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            font-size: 14px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        #startBtn { background-color: var(--primary); color: #0f172a; }
        #pauseBtn { background-color: #eab308; color: #0f172a; }
        #stopBtn { background-color: var(--danger); color: white; }
        button:disabled { background-color: #475569 !important; color: var(--text-muted) !important; opacity: 0.5; cursor: not-allowed; }

        .section-title {
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin: 20px 0 10px 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .meta-input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: left;
            font-size: 13px;
            margin-bottom: 10px;
        }

        label { display: block; margin-bottom: 4px; color: var(--text-muted); }
        select, input, textarea {
            background: #0f172a;
            color: white;
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea { resize: vertical; height: 60px; }

        /* Catalog Layout */
        .catalog-container {
            width: 100%;
            max-width: 500px;
        }

        .search-box {
            margin-bottom: 15px;
        }

        .log-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .log-title { font-weight: bold; font-size: 16px; color: var(--text-color); }
        .log-date { font-size: 12px; color: var(--text-muted); }
        
        .tag-badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 4px;
            text-transform: uppercase;
        }
        .tag-work { background: #3b82f6; color: white; }
        .tag-personal { background: #ec4899; color: white; }
        .tag-idea { background: #eab308; color: #0f172a; }
        .tag-journal { background: #8b5cf6; color: white; }
        .tag-custom { background: #64748b; color: white; }

        .log-notes {
            font-size: 13px;
            color: var(--text-muted);
            margin: 8px 0;
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid var(--primary);
            white-space: pre-wrap; /* Maintains line-breaks in summaries */
        }

        audio { width: 100%; margin-top: 5px; }
        
        .card-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
        }
        .action-btn {
            background: transparent;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
